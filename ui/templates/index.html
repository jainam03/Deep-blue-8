        @import url('https://fonts.googleapis.com/css2?family=Poppins&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #1d1d1d;

            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        h1 {
            letter-spacing: 2px;
            background-image: -webkit-linear-gradient(to right, #f64f59, #c471ed, #12c2e9);
            
            background-image: linear-gradient(to right, #f64f59, #c471ed, #12c2e9);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        form {
            display: flex;
            flex-direction: column;

            gap: 10px;

            background: #363636;
            padding: 20px 25px;
            margin: 10px 0;

            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        label {
            font-weight: bold;
            letter-spacing: 1.5px;
            color: #fff;
        }

        input[type="file"] {
            border: 0 solid #ddd;
            border-radius: 5px;

            background-color: #363636;
            padding: 10px;
            margin: 5px 0;

            font-size: inherit;
            letter-spacing: 2px;
            color: #fff;

            cursor: pointer;

            box-shadow:0 3px 8px rgba(0, 0, 0, 0.5);

            text-align: center;
            vertical-align: middle;
        }

        input[type="file"]::file-selector-button {
            background: #12c2e9;
            /* fallback for old browsers */
            background-image: -webkit-linear-gradient(to right, #f64f59, #c471ed, #12c2e9);
            /* Chrome 10-25, Safari 5.1-6 */
            background-image: linear-gradient(to right, #f64f59, #c471ed, #12c2e9);
            /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */
            
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2px;
            /* letter-spacing: 2px; */
            padding: 10px;
            margin: 0 10px 0 0;

            border-radius: 5px;
            border: none;
            outline: none;

            cursor: pointer;

            transition: 0.3s;
        }

        .submit {
            display: flex;
            justify-content: center;
            margin: 25px 0 15px 0;
        }

        input[type="submit"] {
            background: #12c2e9;
            /* fallback for old browsers */
            background: -webkit-linear-gradient(to right, #f64f59, #c471ed, #12c2e9);
            /* Chrome 10-25, Safari 5.1-6 */
            background: linear-gradient(to right, #f64f59, #c471ed, #12c2e9);
            /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */

            cursor: pointer;

            font-size: 23px;
            font-weight: 800;
            letter-spacing: 2px;
            padding: 10px;

            border: none;
            border-radius: 10px;

            transition: 0.2s;
        }
    </style>
</head>

<body>
    <h1>Summary Generator</h1>
    <form action="{{url_for('summarization')}}" method="post" enctype="multipart/form-data">
        <label for="video-file">Enter a Video File:</label>
        <input type="file" name="video" id="video-file" accept=".mp4">
        <label for="csv-file">Enter a CSV File:</label>
        <input type="file" name="csv_file" id="csv-file" accept=".csv">
        <div class="submit">
            <input type="submit" value="Generate Summary">
        </div>
    </form>
</body>
