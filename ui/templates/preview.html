<!DOCTYPE html>
<html>

<head>
    <title>Summary</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family: 'Poppins',sans-serif;
        }
        body {

            display: flex;
            flex-direction: column;
            align-items: center;
            
            background-color: #1d1d1d;
        }

        h1 {
            letter-spacing: 2px ;
            margin: 10px 0 15px 0;
            
            background-color: #62b0f0;

            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container1 {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            padding-right: 55px;
            padding-left: 30px;
            background-color: rgba(255,255,255,0.8);
            box-shadow: 0 0 10px rgba(246, 244, 244, 0.981);
            border-radius: 5px;
            letter-spacing: 2px;
        }

        .container2 {
            margin: 10px 20px;
            padding: 10px 0;
        }

        label {
            display: block;
            letter-spacing: 2px;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            background-color: rgba(0,0,0,0.8);
            border-radius: 10px;
            resize: none;
            overflow: auto;
            height: 250px;
        }

        .bullet {
            list-style-type: disc;
            font-size: larger;
            font-weight: bold;

        }
    </style>
</head>

<body>
    <h1>Summary Generator:</h1>
    <div class="container1">
        <label for="output">Summary:</label>
        <textarea id="output">{{result21}}</textarea>
        <div class="container2">
            <ul>
                <li class="bullet">The Length of the given Video is {{h}} hours {{m}} minutes and {{ss}} seconds</li>
                <br>
                <li class="bullet">The Total no. of Attendees that were present in the Metting are : {{c}}</li>
            </ul>
        </div>
    </div>
</body>

</html>
